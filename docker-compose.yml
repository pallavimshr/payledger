# Runs Postgres locally. Start with: make db
services:
  postgres:
    image: postgres:16-alpine
    container_name: payledger-db
    environment:
      POSTGRES_USER: payledger
      POSTGRES_PASSWORD: payledger
      POSTGRES_DB: payledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payledger"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
